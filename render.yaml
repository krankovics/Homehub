services:
  - type: web
    name: homehub
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: BRIDGE_TOKEN
        sync: false
      - key: SIGNAL_TOKEN
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATA_FILE
        value: /tmp/homehub/state.json
      - key: BRIDGE_STALE_MS
        value: "90000"
      - key: TUYA_ACCESS_ID
        sync: false
      - key: TUYA_ACCESS_SECRET
        sync: false
      - key: TUYA_API_ENDPOINT
        value: https://openapi.tuyaeu.com
      - key: TUYA_REFRESH_MS
        value: "15000"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      - key: AI_TIMEOUT_MS
        value: "45000"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: HomeHub
      - key: ALERT_EMAIL_TO
        sync: false

      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

services:
  - type: web
    name: homehub
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: BRIDGE_TOKEN
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATA_FILE
        value: /tmp/homehub/state.json
      - key: BRIDGE_STALE_MS
        value: "90000"
      - key: TUYA_ACCESS_ID
        sync: false
      - key: TUYA_ACCESS_SECRET
        sync: false
      - key: TUYA_API_ENDPOINT
        value: https://openapi.tuyaeu.com
      - key: TUYA_REFRESH_MS
        value: "15000"
